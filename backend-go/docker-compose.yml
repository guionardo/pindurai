services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pindurai
      POSTGRES_USER: pindurai
      POSTGRES_PASSWORD: pindurai-local-only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pindurai -d pindurai"]
      interval: 2s
      timeout: 3s
      retries: 15
